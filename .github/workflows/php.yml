name: build

on:
  push:
    branches: [ master, v2, v3 ]
  pull_request:
    branches: [ master, v2, v3 ]

jobs:
  build:
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        php-versions: [ '8.3', '8.4', '8.5', ]

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP with PCOV
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        coverage: pcov

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Run linter
      run: test -f vendor/bin/pint && vendor/bin/pint -v --test || echo 'pint not installed, skipping'

    - name: Run tests
      run: vendor/bin/phpunit -c ./phpunit.xml

    - name: Run PHPStan
      run: test -f vendor/bin/phpstan && vendor/bin/phpstan analyse --no-progress || echo 'phpstan not installed, skipping'

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
